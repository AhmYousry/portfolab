name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pb
          POSTGRES_PASSWORD: pb_ci_only
          POSTGRES_DB: portfolio_builder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pb" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://pb:pb_ci_only@localhost:5432/portfolio_builder
      TEST_DATABASE_URL: postgresql://pb:pb_ci_only@localhost:5432/portfolio_builder_test
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
      CORS_ORIGINS: http://localhost:5173,http://localhost:5175
      APP_URL: http://localhost:5173
      SEED_ADMIN_EMAIL: admin@portfolio.test
      SEED_ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=pb_ci_only psql -h localhost -U pb -d portfolio_builder -c "CREATE DATABASE portfolio_builder_test;"
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Migrate and seed dev database for E2E
        run: |
          pnpm --filter @pb/api db:deploy
          pnpm --filter @pb/api db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  taskflow-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/taskflow-lite/reference
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_ci_only
          POSTGRES_DB: taskflow_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U taskflow" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://taskflow:taskflow_ci_only@localhost:5433/taskflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
