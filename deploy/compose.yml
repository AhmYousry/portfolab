name: portfolab

x-api: &api
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: api
  image: portfolab-api:local
  environment:
    NODE_ENV: production
    PORT: '4000'
    DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:?required}
    APP_URL: https://${SITE_DOMAIN:?required}
    CORS_ORIGINS: https://${SITE_DOMAIN:?required}
    API_PUBLIC_URL: https://${SITE_DOMAIN:?required}
    CONTENT_DIR: /app/content
    SESSION_SECRET: ${SESSION_SECRET:?required}
    SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
    MAIL_PROVIDER: resend
    RESEND_API_KEY: ${RESEND_API_KEY:?required}
    EMAIL_FROM: ${EMAIL_FROM:?required}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    CHECKOUT_ENABLED: 'false'
    POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
    POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
    ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-395}
  networks: [db, edge]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [db]

  migrate:
    <<: *api
    restart: 'no'
    command:
      - sh
      - -c
      - ./node_modules/.bin/prisma migrate deploy && node dist/scripts/import-content.js
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        VITE_FREE_LAUNCH: ${VITE_FREE_LAUNCH:-true}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://eu.i.posthog.com}
        VITE_POSTHOG_REPLAY_ENABLED: 'false'
    image: portfolab-web:local
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?required}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

networks:
  db:
    internal: true
  edge: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
